<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <title>Our Installs | Sovereign Energy</title>
  <style>
    :root {
      --bg: #ffffff;
      --text: #000000;
      --text-muted: rgba(0, 0, 0, 0.55);
      --font: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    }

    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      -webkit-font-smoothing: antialiased;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
    }

    .header {
      padding: 2rem clamp(1.5rem, 4vw, 6rem);
      border-bottom: 1px solid rgba(0,0,0,0.1);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .header h1 {
      font-size: 1.5rem;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    .back-link {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text);
      text-decoration: none;
      border-bottom: 1px solid var(--text);
    }

    .back-link:hover {
      opacity: 0.6;
    }

    .installs-list {
      max-width: 900px;
      margin: 0 auto;
      padding: clamp(2rem, 4vw, 4rem) clamp(1.5rem, 4vw, 6rem);
      display: flex;
      flex-direction: column;
      gap: 3rem;
    }

    .installs-list img {
      width: 100%;
      height: auto;
      display: block;
    }
  </style>
</head>
